<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rock Paper Scissors</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body><main><header><small>JavaScript Practicum · Assignment 3</small><h1>Rock Paper Scissors</h1><p>Choose your move. First to five points wins.</p></header><section class="panel" aria-label="Game"><p class="score">You <span id="player-score">0</span> : <span id="computer-score">0</span> Computer</p><div class="actions" aria-label="Choose a move"><button data-choice="rock">Rock</button><button data-choice="paper">Paper</button><button data-choice="scissors">Scissors</button></div><div id="results" role="status" aria-live="polite"><p>Make your first move to begin.</p></div><button id="restart" class="primary">New game</button></section><footer>Built with HTML, CSS and JavaScript.</footer></main></body>
</html>
